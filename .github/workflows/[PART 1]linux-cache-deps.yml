name: (PART 1) Linux - Build Dependencies

on:
  workflow_run:
    workflows: ["Tag trigger"]
    types: [completed]
  workflow_dispatch:

jobs:
  build-deps:
    name: Build & Cache Dependencies
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-linux-dynamic
      CC: clang
      CXX: clang++
      LDFLAGS: "-fuse-ld=lld"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Restore vcpkg artifacts
        uses: actions/cache/restore@v5
        id: restore-cache
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}/vcpkg_installed
            ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Install system dependencies (Qt6 GUI)
        if: steps.restore-cache.outputs.cache-matched-key == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential \
            ninja-build pkg-config \
            autoconf automake autoconf-archive libtool libltdl-dev python3 python3-pip \
            curl git unzip zip libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev \
            libxrender-dev libxrandr-dev libxcursor-dev libxinerama-dev libxss-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-keysyms1-dev \
            libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-render0-dev \
            libxcb-render-util0-dev libxcb-util-dev libxcb-xinput-dev libxcb-cursor-dev \
            libxcb-glx0-dev libxcb-xkb-dev libxcb-xinerama0-dev libxcb-damage0-dev \
            libxcb-composite0-dev libgtk-3-dev libsm-dev libice-dev libgl1-mesa-dev \
            libegl1-mesa-dev libgles2-mesa-dev mesa-common-dev libglu1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libicu-dev libdbus-1-dev \
            libudev-dev libvulkan-dev libssl-dev libsecret-1-dev gperf libb2-dev

      - name: Install LLVM 22 and libc++22
        if: steps.restore-cache.outputs.cache-matched-key == ''
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all          
          sudo apt-get install -y libc++-22-dev libc++abi-22-dev

      - name: Fix Clang version to 22
        if: steps.restore-cache.outputs.cache-matched-key == ''
        run: |
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-22 100

      - name: Install CMake 4.3.0 (Primary Build System)
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v4.3.0/cmake-4.3.0-linux-x86_64.sh          
          sudo sh cmake-4.3.0-linux-x86_64.sh --prefix=/usr/local --skip-license --exclude-subdir          
          rm cmake-4.3.0-linux-x86_64.sh          
          cmake --version

      - name: Setup vcpkg
        if: steps.restore-cache.outputs.cache-matched-key == ''
        run: |
          if [ ! -d "${VCPKG_ROOT}/.git" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
            "$VCPKG_ROOT/bootstrap-vcpkg.sh"
          fi

      - name: Write overlay triplet
        if: steps.restore-cache.outputs.cache-matched-key == ''
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/vcpkg-triplets"
          cat > "${GITHUB_WORKSPACE}/vcpkg-triplets/x64-linux-dynamic.cmake" <<'EOF'
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE dynamic)
          set(VCPKG_CMAKE_SYSTEM_NAME Linux)
          set(VCPKG_CXX_FLAGS "-stdlib=libc++")
          set(VCPKG_C_FLAGS "")
          set(VCPKG_LINKER_FLAGS "-stdlib=libc++")
          set(QT_FEATURE_shared ON CACHE BOOL "")
          set(QT_FEATURE_static OFF CACHE BOOL "")
          EOF

      - name: Install dependencies via vcpkg
        if: steps.restore-cache.outputs.cache-matched-key == ''
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet "${{ env.VCPKG_DEFAULT_TRIPLET }}" \
            --overlay-triplets="$GITHUB_WORKSPACE/vcpkg-triplets" \
            --x-install-root="${{ github.workspace }}/vcpkg_installed" \
            --clean-after-build
        env:
          VCPKG_FEATURE_FLAGS: manifests
          VCPKG_BUILD_TYPE: release

      - name: Export vcpkg build logs      
        if: failure()
        run: |
          find "${{ github.workspace }}/vcpkg/buildtrees" -name "*.log" -type f -exec echo "--- LOG: {} ---" \; -exec tail -n 200 {} \;

      - name: Cleanup buildtrees (To keep cache small)
        if: steps.restore-cache.outputs.cache-matched-key == ''
        run: |
          rm -rf "${VCPKG_ROOT}/buildtrees"
          rm -rf "${VCPKG_ROOT}/packages"
          rm -rf "${VCPKG_ROOT}/downloads"
          rm -rf "${VCPKG_ROOT}/installed"
          
          echo "Cleanup completed. Ready to save cache."

      - name: Save vcpkg artifacts (Force save even on failure)
        uses: actions/cache/save@v5
        if: steps.restore-cache.outputs.cache-matched-key == ''
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            ${{ github.workspace }}/vcpkg_installed
            ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          