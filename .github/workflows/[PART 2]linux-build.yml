name: (PART 2) Linux - Build & Release

on:
  workflow_run:
    workflows: ["(PART 1) Linux - Build Dependencies"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-linux-dynamic
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  build-and-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install apt packages (build tools)
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update -y && \
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ninja-build \
            jq curl unzip zip ccache patchelf rsync libgl1-mesa-dev \
            libsecret-1-dev clang lld \
            autoconf autoconf-archive automake libtool libltdl-dev gettext \
            '^libxcb.*-dev' libx11-xcb-dev libglu1-mesa-dev libxrender-dev \
            libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1-mesa-dev

      - name: Fix Clang version to 18
        run: |
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Restore vcpkg & Qt6 artifacts
        uses: actions/cache/restore@v4
        id: restore-vcpkg
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}/vcpkg_installed
            ~/.cache/vcpkg/archives
          key: linux-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            linux-vcpkg-

      # - name: List restored vcpkg & Qt6 libraries and plugins
      #   run: |
      #     set -e
      #     VCPKG_DIR="${{ github.workspace }}/vcpkg_installed/x64-linux-dynamic"

      #     echo "== Restored Qt6 libraries =="
      #     ls -1 "$VCPKG_DIR/lib"/libQt6*.so* || echo "No Qt6 libraries found"

      #     echo "== Restored other common libs =="
      #     ls -1 "$VCPKG_DIR/lib"/libspdlog.so*   || echo "No spdlog found"
      #     ls -1 "$VCPKG_DIR/lib"/libfmt.so*      || echo "No fmt found"
      #     ls -1 "$VCPKG_DIR/lib"/libssl.so*      || echo "No openssl found"
      #     ls -1 "$VCPKG_DIR/lib"/libcrypto.so*   || echo "No openssl crypto found"
      #     ls -1 "$VCPKG_DIR/lib"/libz.so*        || echo "No zlib found"
      #     ls -1 "$VCPKG_DIR/lib"/libsqlite3.so*  || echo "No sqlite3 found"
      #     ls -1 "$VCPKG_DIR/lib"/libicu*.so*     || echo "No ICU libraries found"

      #     echo "== Searching for any Qt6 plugin directories =="
      #     find "$VCPKG_DIR" -type d \( -name "*plugins*" -o -name "*plugin*" \) || echo "No Qt6 plugin directories found"

      #     echo "== Searching for any Qt6 plugin files =="
      #     find "$VCPKG_DIR" -type f \( -name "*.so" -o -name "*.so.*" \) \( -path "*plugins*" -o -path "*plugin*" \) || echo "No Qt6 plugin libraries found"

      #     exit 1

      - name: Verify Cache Integrity
        run: |
          if [ ! -d "${{ github.workspace }}/vcpkg_installed" ]; then
            echo "Error: Cache from JOB 1 not found. Please run JOB 1 first."
            exit 1
          fi

      - name: Setup ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Configure ccache (safe + CI optimized)
        run: |
          mkdir -p "${CCACHE_DIR}"
          printf '%s\n' \
            "max_size = ${CCACHE_MAXSIZE}" \
            "compression = true" \
            "compression_level = 5" \
            "sloppiness = include_file_mtime,time_macros" \
            "base_dir = ${GITHUB_WORKSPACE}" \
            > "${CCACHE_DIR}/ccache.conf"
          echo "CCACHE_CONFIGPATH=${CCACHE_DIR}/ccache.conf" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> $GITHUB_ENV

      - name: Setup vcpkg binary cache path
        run: |
          ABS_ARCHIVES=$(realpath "${VCPKG_ROOT}/archives")
          echo "ABS_ARCHIVES=${ABS_ARCHIVES}" >> $GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;files,${ABS_ARCHIVES},readwrite" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_DEFAULT_TRIPLET }} \
            -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed \
            -DVCPKG_MANIFEST_MODE=ON \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          CC: clang
          CXX: clang++

      - name: Build (parallel)
        run: cmake --build build --parallel

      # - name: List Notesman runtime dependencies
      #   run: |
      #     set -e
      #     echo "== ldd check with vcpkg libraries =="
      #     export LD_LIBRARY_PATH="${{ github.workspace }}/vcpkg_installed/x64-linux-dynamic/lib:$LD_LIBRARY_PATH"
      #     ldd "${{ github.workspace }}/bin/Notesman"

