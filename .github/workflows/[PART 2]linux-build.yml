name: (PART 2) Linux - Build & Release

on:
  workflow_run:
    workflows: ["(PART 1) Linux - Build Dependencies"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-linux-dynamic
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  build-and-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install apt packages (build tools)
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update -y && \
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ninja-build \
            jq curl unzip zip ccache patchelf rsync libgl1-mesa-dev \
            libsecret-1-dev clang lld \
            autoconf autoconf-archive automake libtool libltdl-dev gettext \
            '^libxcb.*-dev' libx11-xcb-dev libglu1-mesa-dev libxrender-dev \
            libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1-mesa-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libgdk-pixbuf-2.0-dev libcairo2-dev

      - name: Fix Clang version to 18
        run: |
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Restore vcpkg & Qt6 artifacts
        uses: actions/cache/restore@v4
        id: restore-vcpkg
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}/vcpkg_installed
            ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Verify Cache Integrity
        run: |
          if [ ! -d "${{ github.workspace }}/vcpkg_installed" ]; then
            echo "Error: Cache from JOB 1 not found. Please run JOB 1 first."
            exit 1
          fi

      - name: Setup ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Configure ccache (safe + CI optimized)
        run: |
          mkdir -p "${CCACHE_DIR}"
          printf '%s\n' \
            "max_size = ${CCACHE_MAXSIZE}" \
            "compression = true" \
            "compression_level = 5" \
            "sloppiness = include_file_mtime,time_macros" \
            "base_dir = ${GITHUB_WORKSPACE}" \
            > "${CCACHE_DIR}/ccache.conf"
          echo "CCACHE_CONFIGPATH=${CCACHE_DIR}/ccache.conf" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> $GITHUB_ENV

      - name: Setup vcpkg binary cache path
        run: |
          ABS_ARCHIVES=$(realpath "${VCPKG_ROOT}/archives")
          echo "ABS_ARCHIVES=${ABS_ARCHIVES}" >> $GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;files,${ABS_ARCHIVES},readwrite" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_DEFAULT_TRIPLET }} \
            -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed \
            -DVCPKG_MANIFEST_MODE=ON \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          CC: clang
          CXX: clang++

      - name: Build (parallel)
        run: cmake --build build --parallel

      - name: Prepare AppDir (Qt6 + vcpkg, controlled)
        run: |
          set -e

          APPDIR=AppDir
          VCPKG_DIR="${{ github.workspace }}/vcpkg_installed/x64-linux-dynamic"

          rm -rf "$APPDIR"
          mkdir -p \
            "$APPDIR/usr/bin" \
            "$APPDIR/usr/lib" \
            "$APPDIR/usr/plugins" \
            "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # ---- main binary ----
          cp bin/Notesman "$APPDIR/usr/bin/Notesman"
          chmod +x "$APPDIR/usr/bin/Notesman"

          cp bin/updater "$APPDIR/usr/bin/updater"
          chmod +x "$APPDIR/usr/bin/updater"

          # ---- Qt runtime from vcpkg ----
          cp "$VCPKG_DIR/lib"/lib*.so* "$APPDIR/usr/lib/"

          # ---- Qt6 plugins (preserve structure) ----
          cp -a "$VCPKG_DIR/Qt6/plugins/"* "$APPDIR/usr/plugins/"

          # ---- Desktop file ----
          cat > "$APPDIR/Notesman.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Notesman
          Exec=Notesman
          Icon=notesman
          Categories=Utility;
          EOF

          cp -v apps/notesman/resources/icons/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/notesman.png"
          cp apps/notesman/resources/icons/icon.png "$APPDIR/notesman.png"

          patchelf --set-rpath '$ORIGIN/../lib' "$APPDIR/usr/bin/Notesman"
          patchelf --set-rpath '$ORIGIN/../lib' "$APPDIR/usr/plugins/platforms/libqxcb.so"
          find "$APPDIR/usr/plugins" -name '*.so' -exec patchelf --set-rpath '$ORIGIN/../../lib' {} \;

      - name: Bundle required XCB runtime libraries
        run: |
          set -e

          APPDIR=AppDir

          REQUIRED_LIBS=(
            libxcb-cursor.so.0
            libxcb-xinput.so.0
          )

          for libname in "${REQUIRED_LIBS[@]}"; do
            libpath=$(ldconfig -p | grep "$libname" | awk '{print $NF}' | head -n1)

            if [ -z "$libpath" ]; then
              echo "ERROR: $libname not found on runner"
              exit 1
            fi

            echo "Bundling $libname from $libpath"
            cp -v "$libpath" "$APPDIR/usr/lib/"
          done

      - name: Verify qxcb dependencies
        run: |
          set -e
          export LD_LIBRARY_PATH="$PWD/AppDir/usr/lib"        
          ldd AppDir/usr/plugins/platforms/libqxcb.so

          if ldd AppDir/usr/plugins/platforms/libqxcb.so | grep -q "not found"; then
            echo "ERROR: Missing runtime libraries"
            exit 1
          fi

      - name: Optimize Library Symlinks (Deduplicate)
        run: |
          set -e
          LIB_DIR="AppDir/usr/lib"
          pushd "$LIB_DIR"

          find . -maxdepth 1 -type l -name "*.so" -delete

          /sbin/ldconfig -n .

          REAL_SQLITE=$(ls libsqlite3.so.* 2>/dev/null | head -n 1)
          if [ -n "$REAL_SQLITE" ]; then
             ln -sf "$REAL_SQLITE" libsqlite3.so
             ln -sf "$REAL_SQLITE" libsqlite3.so.0
          fi
          popd

      - name: Detect prunable libraries
        run: |
          bash apps/notesman/scripts/detect_prunable_libs.sh

      - name: Show prune list
        run: |
          echo "===== PRUNE LIST ====="
          cat prune_libs.txt

      - name: Filter prune list with Qt runtime whitelist
        run: |
          set -e

          cat prune_libs.txt \
            | grep -Ev '^(libQt6|libxcb|libX|libwayland|libicu|libharfbuzz|libfreetype|libfontconfig|libpng|libjpeg|libturbojpeg|libz|libzstd|libb2|libbrotli|libdouble-conversion|libpcre2|libssl|libcrypto|libGL|libEGL|libOpenGL|libdbus-1|libresolv|libnss|libgcc_s|libstdc\+\+|libsqlite3|libspdlog|liblzma|liblz4|libbz2)' \
            > prune_libs.safe.txt

          echo "===== SAFE PRUNE LIST ====="
          cat prune_libs.safe.txt

      - name: Prune unused libraries (safe)
        run: |
          set -e

          LIBDIR=AppDir/usr/lib

          while read -r lib; do
            [ -z "$lib" ] && continue

            if [ -f "$LIBDIR/$lib" ]; then
              echo "Removing $lib"
              rm -v "$LIBDIR/$lib"
            else
              echo "Skip missing $lib"
            fi
          done < prune_libs.safe.txt

      - name: Remove unused Qt files from AppDir
        run: |
          set -e
          APPDIR=AppDir/usr
          [ -d "$APPDIR" ] || { echo "AppDir not found"; exit 1; }

          echo "Cleaning unused Qt modules and plugins..."

          rm -rf "$APPDIR/plugins/platformthemes" || true
          rm -rf "$APPDIR/plugins/egldeviceintegrations" || true
          rm -rf "$APPDIR/plugins/generic" || true
          rm -rf "$APPDIR/plugins/networkinformation" || true
          rm -rf "$APPDIR/plugins/platformthemes" || true
          rm -rf "$APPDIR/plugins/sqldrivers" || true
          rm -rf "$APPDIR/share/doc" || true
          rm -rf "$APPDIR/translations" || true

          IMAGE_FORMATS="$APPDIR/plugins/imageformats"
          if [ -d "$IMAGE_FORMATS" ]; then
            find "$IMAGE_FORMATS" -type f ! -name 'libqico.so' ! -name 'libqsvg.so' -delete
          fi

          PLATFORMS_DIR="$APPDIR/plugins/platforms"
          if [ -d "$PLATFORMS_DIR" ]; then
            find "$PLATFORMS_DIR" -type f ! -name 'libqxcb.so' ! -name 'libqoffscreen.so' -delete
          fi

          TLS_DIR="$APPDIR/plugins/tls"
          if [ -d "$TLS_DIR" ]; then
            rm -f "$TLS_DIR/libqcertonlybackend.so"
          fi

      - name: Download AppImage runtime with retry
        run: |
          mkdir -p runtime-cache

          for i in 1 2 3; do
            wget -O runtime-cache/runtime-x86_64 \
              https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 \
              && break || sleep 5
          done

      - name: Download appimagetool
        run: |
          wget -O appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Read version from version.txt
        id: get_version
        run: |
          VERSION="0.0.0"

          if [ -f version.txt ]; then
            APP_LINE=$(grep -E '^APP=' version.txt | head -n 1 || true)
            if [ -n "$APP_LINE" ]; then
              VERSION="${APP_LINE#APP=}"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package cleaned AppDir into AppImage (use appimagetool)
        run: |
          APPDIR=AppDir

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="$HERE/usr/plugins"
          export QML2_IMPORT_PATH="$HERE/usr/qml"
          exec "$HERE/usr/bin/Notesman" "$@"
          EOF

          chmod +x "$APPDIR/AppRun"

          appName="Notesman-x86_64-v${{ steps.get_version.outputs.version }}.AppImage"
          ./appimagetool-x86_64.AppImage --runtime-file runtime-cache/runtime-x86_64 $APPDIR "${appName}"

      - name: Cleanup tools after packaging
        run: rm -f linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage || true

      - name: Show resulting AppImage
        run: |
          mkdir -p release
          shopt -s nullglob
          appimages=(Notesman*.AppImage)
          if [ ${#appimages[@]} -eq 0 ]; then
            echo "No AppImage found, listing directory:"
            ls -la
            exit 1
          fi
          mv "${appimages[@]}" release/
          
      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: notesman-linux-appimage
          path: release/*.AppImage
          retention-days: 1

      - name: Get existing release body
        id: get_release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_AUTHOR_PAT }}
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'v${{ steps.get_version.outputs.version }}'
              });
              return release.data.body;
            } catch (e) {
              core.setFailed(`Cannot get release: ${e}`);
            }

      - name: Update Linux section in release body
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_AUTHOR_PAT }}
          script: |
            let body = `${{ steps.get_release.outputs.result }}`;
            if (!body) body = "**Notesman v${{ steps.get_version.outputs.version }}**\n\n";

            body = body.replace(/^"+|"+$/g, '');
            
            body = body.replace(/<!-- LINUX_SECTION_START -->[\s\S]*?<!-- LINUX_SECTION_END -->/, `
            <!-- LINUX_SECTION_START -->
            **Linux Build**
            - Linux AppImage included
            <!-- LINUX_SECTION_END -->
            `);

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: 'v${{ steps.get_version.outputs.version }}'
            });

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              body: body
            });

      - name: Upload Linux assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          files: release/*.AppImage
          token: ${{ secrets.RELEASE_AUTHOR_PAT }}
