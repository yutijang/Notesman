name: Linux debug

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-linux # we will request dynamic libs via env below
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install apt packages (build tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld cmake ninja-build pkg-config \
            jq curl unzip zip ccache patchelf rsync libgl1-mesa-dev

      - name: Setup ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/CMakeLists.txt', '**/*.cpp', '**/*.hpp', '**/*.h', '**/*.cxx', '**/*.ixx', '**/CMakeCache.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          mkdir -p "${CCACHE_DIR}"
          echo "max_size = ${CCACHE_MAXSIZE}" > ~/.ccache/ccache.conf || true
          export PATH="/usr/lib/ccache:$PATH" || true
          ccache --zero-stats || true
          ccache --show-config || true

      - name: Setup vcpkg (bootstrap)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '271a5b8850aa50f9a40269cbf3cf414b36e333d6'
          runVcpkgInstall: false

      - name: Prepare vcpkg manifest for CI (remove qtbase)
        run: |
          if [ ! -f vcpkg.json ]; then
            echo "No vcpkg.json in repo root — aborting"
            exit 1
          fi
          jq 'del(.dependencies[] | select(.name == "qtbase"))' vcpkg.json > vcpkg-ci.json
          echo "---- vcpkg-ci.json ----"
          cat vcpkg-ci.json

      - name: Install Qt6 (from action marketplace) - Shared libs
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          install-deps: true
          cache: true

      - name: Locate Qt6 installation
        id: find_qt
        run: |
          QT_BIN=$(which qmake-qt6 2>/dev/null || which qmake 2>/dev/null || true)
          if [ -z "$QT_BIN" ]; then
            QT_CMAKE_DIR=$(find $HOME /opt -type d -path "*/Qt*/6*/*/lib/cmake/Qt6" 2>/dev/null | head -n1 || true)
            if [ -z "$QT_CMAKE_DIR" ]; then
              echo "Could not detect Qt installation automatically. Aborting."
              exit 1
            fi
            QT_DIR=$(dirname $(dirname "$QT_CMAKE_DIR"))
          else
            QT_DIR=$(dirname $(dirname "$QT_BIN"))
          fi
          echo "qt_bin=$QT_BIN" >> $GITHUB_OUTPUT
          echo "qt_dir=$QT_DIR" >> $GITHUB_OUTPUT
          echo "Qt6_DIR=${QT_DIR}/lib/cmake/Qt6" >> $GITHUB_OUTPUT
          echo "Detected Qt dir: $QT_DIR"
          ls -la "${QT_DIR}" || true

      - name: Show found Qt info
        run: |
          echo "qt_bin = ${{ steps.find_qt.outputs.qt_bin }}"
          echo "qt_dir = ${{ steps.find_qt.outputs.qt_dir }}"
          echo "Qt6 cmake dir = ${{ steps.find_qt.outputs['Qt6_DIR'] }}" || true

      - name: Install non-Qt dependencies via vcpkg (manifest-mode, using vcpkg-ci.json)
        run: |
          "$VCPKG_ROOT/vcpkg" --version
          cp vcpkg-ci.json vcpkg.json
          "$VCPKG_ROOT/vcpkg" install --triplet "${{ env.VCPKG_DEFAULT_TRIPLET }}"
        env:
          VCPKG_FEATURE_FLAGS: manifests
          VCPKG_DEFAULT_TRIPLET: ${{ env.VCPKG_DEFAULT_TRIPLET }}
          CC: clang
          CXX: clang++

      - name: Configure CMake (use vcpkg toolchain and Qt6 dir)
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
            -DQt6_DIR="${{ steps.find_qt.outputs['Qt6_DIR'] }}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          CC: clang
          CXX: clang++
          LD: lld

      - name: Clean stale precompiled headers (Linux)
        run: |
          echo "Cleaning possible stale precompiled headers..."
          find build -type f \( -name "*.pch" -o -name "*.gch" \) -delete 2>/dev/null || true

      - name: Build (parallel)
        run: |
          cmake --build build --config ${BUILD_TYPE} --parallel

      - name: Run tests
        run: |
          TEST_DIRS=("bin/tests" "build/tests" "build/bin/tests")
          FOUND=false

          for dir in "${TEST_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              TESTS=($(find "$dir" -maxdepth 1 -type f -executable -name '*-tests'))
              if [ ${#TESTS[@]} -gt 0 ]; then
                FOUND=true
                echo "Found ${#TESTS[@]} test binaries in $dir:"
                for t in "${TESTS[@]}"; do
                  echo "  → $(basename "$t")"
                  "$t" || true
                done
                break
              fi
            fi
          done

          if [ "$FOUND" = false ]; then
            echo "No test binaries found, skipping tests."
          fi

      - name: Prepare AppDir for linuxdeployqt
        run: |
          set -e
          APPDIR=AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib"
          if [ -f ./bin/Notesman ]; then
            cp ./bin/Notesman "$APPDIR/usr/bin/Notesman"
          elif [ -f build/Notesman ]; then
            cp build/Notesman "$APPDIR/usr/bin/Notesman"
          else
            echo "Built binary not found in ./bin or build/ - adjust paths"
            ls -la ./bin || true
            ls -la build || true
            exit 1
          fi
          cat > "$APPDIR/Notesman.desktop" <<'EOF'
          [Desktop Entry]
          Name=Notesman
          Exec=Notesman
          Icon=notesman
          Type=Application
          Categories=Utility;
          EOF
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -v resources/icons/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/notesman.png" || true

      - name: Download linuxdeploy and plugin-qt
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Install Qt runtime dependencies for AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1 libxcb-cursor0 libx11-6 libx11-xcb1 libxext6 libxrender1 libxi6 \
            libxrandr2 libxfixes3 libxrender1 libxkbcommon0 libglu1-mesa libfontconfig1 \
            libfreetype6 libdbus-1-3 libglib2.0-0

      - name: Bundle Qt6 app into AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e AppDir/usr/bin/Notesman \
            -d AppDir/Notesman.desktop \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/notesman.png \
            --plugin qt \
            --output appimage

      - name: Cleanup tools after packaging
        run: |
          rm -f linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage || true            

      - name: Show resulting AppImage
        run: |
          mkdir -p release
          mv Notesman*.AppImage release/ || true
          if [ -z "$(ls release/*.AppImage 2>/dev/null || true)" ]; then
            echo "No AppImage found in release/, listing directory:"
            ls -la
            exit 1
          fi

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: notesman-linux-appimage
          path: release/*.AppImage

      - name: Extract project version from CMakeLists.txt
        id: get_version
        run: |
          VERSION=$(grep -Po '(?<=VERSION )\d+\.\d+\.\d+' CMakeLists.txt || echo "0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (manual version)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: "Notesman v${{ steps.get_version.outputs.version }} (Linux AppImage)"
          body: "Automated release for Notesman v${{ steps.get_version.outputs.version }}."
          files: release/*.AppImage
          token: ${{ secrets.RELEASE_AUTHOR_PAT }}

      - name: Show ccache stats
        run: |
          ccache --show-stats || true
