name: Cleanup Cache

on:
  schedule:
    - cron: '0 0 * * 0'   # Mỗi Chủ Nhật 00:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Ensure GitHub CLI
        run: |
          if ! command -v gh &> /dev/null; then
            sudo apt-get update && sudo apt-get install gh -y
          fi

      - name: Authenticate
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Install gh-actions-cache extension
        run: gh extension list | grep -q actions/gh-actions-cache || gh extension install actions/gh-actions-cache

      - name: List caches
        run: gh actions-cache list -R ${{ github.repository }} --limit 100 > cache_list.txt

      - name: Show top caches
        run: |
          echo "=== Current cache summary ==="
          awk -F'\t' '{printf "%-80s %10s %10s\n", $1, $2, $3}' cache_list.txt | head -n 20

      - name: Delete caches older than 30 days
        run: |
          echo "Deleting caches older than 30 days..."
          awk -F'\t' '{ if ($3 ~ /^[0-9]+$/ && $3 > 2592000) print $1 }' cache_list.txt | \
          xargs -r -I {} sh -c 'echo "🧹 Deleting old cache: {}"; gh actions-cache delete "{}" -R ${{ github.repository }} --confirm || true'

      - name: Cleanup vcpkg caches (Per OS)
        run: |
          # Linux
          grep "Linux-vcpkg" cache_list.txt | sort -rk3 | awk -F'\t' '{print $1}' | tail -n +6 | \
          xargs -r -I {} sh -c 'echo "🧹 Deleting Linux vcpkg: {}"; gh actions-cache delete "{}" -R ${{ github.repository }} --confirm || true'

          # Windows
          grep "Windows-vcpkg-bin" cache_list.txt | sort -rk3 | awk -F'\t' '{print $1}' | tail -n +6 | \
          xargs -r -I {} sh -c 'echo "🧹 Deleting Windows vcpkg: {}"; gh actions-cache delete "{}" -R ${{ github.repository }} --confirm || true'

      - name: Cleanup ccache caches (Per OS)
        run: |
          # Linux
          grep "Linux-ccache" cache_list.txt | sort -rk3 | awk -F'\t' '{print $1}' | tail -n +6 | \
          xargs -r -I {} sh -c 'echo "🧹 Deleting Linux ccache: {}"; gh actions-cache delete "{}" -R ${{ github.repository }} --confirm || true'

          # Windows
          grep "Windows-ccache" cache_list.txt | sort -rk3 | awk -F'\t' '{print $1}' | tail -n +6 | \
          xargs -r -I {} sh -c 'echo "🧹 Deleting Windows ccache: {}"; gh actions-cache delete "{}" -R ${{ github.repository }} --confirm || true'

      - name: Cleanup Qt caches (Per OS)
        run: |
          for os in "Linux" "Windows"; do
            echo "Cleaning Qt caches for $os..."
            grep "install-qt-action-" cache_list.txt | grep "$os" | sort -rk3 | awk -F'\t' '{print $1}' | tail -n +4 | \
            xargs -r -I {} sh -c 'echo "🧹 Deleting Qt cache ($os): {}"; gh actions-cache delete "{}" -R ${{ github.repository }} --confirm || true'
          done
