name: Tag trigger

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Read version from version.txt
        id: get_version
        run: |
          VERSION=$(tr -d '\r\n[:space:]' < version.txt 2>/dev/null || true)
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create dummy release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: "Notesman v${{ steps.get_version.outputs.version }}"
          body: |
            **Notesman ${{ steps.get_version.outputs.version }}**

            This release includes builds for:

            <!-- LINUX_SECTION_START -->
            *Placeholder for Linux build*
            <!-- LINUX_SECTION_END -->

            <!-- WINDOWS_SECTION_START -->
            *Placeholder for Windows build*
            <!-- WINDOWS_SECTION_END -->

            ---
            _Generated automatically by GitHub Actions._
          draft: false
          prerelease: false
          token: ${{ secrets.RELEASE_AUTHOR_PAT }}
