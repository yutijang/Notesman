name: Linux - Build Dependencies
on:
  workflow_dispatch:

jobs:
  build-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install System Build Tools (Required for Qt/OpenSSL/Gperf)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config jq curl unzip zip \
            autoconf autoconf-archive automake libtool libtool-bin \
            libx11-dev libx11-xcb-dev libfontenc-dev libice-dev libsm-dev \
            libxau-dev libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxrandr-dev libxrender-dev libxss-dev \
            libxtst-dev libxxf86vm-dev libxcb-render0-dev libxcb-render-util0-dev \
            libxcb-xkb-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-present-dev libxcb-glx0-dev libxcb-dri3-dev libgl1-mesa-dev \
            libsecret-1-dev libssl-dev libdbus-1-dev

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg artifacts
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            ${{ github.workspace }}/vcpkg_installed
          key: linux-vcpkg-qt683-${{ hashFiles('vcpkg.json') }}

      - name: Vcpkg Install
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          ./vcpkg/vcpkg install --triplet x64-linux-dynamic \
            --x-install-root="${{ github.workspace }}/vcpkg_installed"