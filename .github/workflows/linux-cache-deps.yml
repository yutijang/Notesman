name: Linux - Build Dependencies

on:
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  build-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config jq curl unzip zip \
            autoconf autoconf-archive automake libtool \
            libgl1-mesa-dev libsecret-1-dev libx11-dev libxkbcommon-dev

      - name: Setup vcpkg
        run: |
          if [ ! -d "${{ env.VCPKG_ROOT }}" ]; then
            git clone https://github.com/microsoft/vcpkg.git ${{ env.VCPKG_ROOT }}
            ${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh
          fi

      - name: Cache vcpkg binaries
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}/vcpkg_installed
          key: linux-vcpkg-qt6-${{ hashFiles('vcpkg.json') }}

      - name: Vcpkg Install
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          # Dùng triplet động như trong CMakePresets của bạn
          ${{ env.VCPKG_ROOT }}/vcpkg install --triplet x64-linux-dynamic \
            --x-install-root="${{ github.workspace }}/vcpkg_installed"
