name: Build & Release (Windows)

on:
  workflow_run:
    workflows: ["Tag trigger"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows
  CCACHE_DIR: ${{ github.workspace }}\.ccache
  CCACHE_MAXSIZE: 500M
  VCPKG_KEEP_ENV_VARS: "CCACHE_DIR;CCACHE_BASEDIR;CCACHE_CONFIGPATH"
  VCPKG_FEATURE_FLAGS: "manifests;compilertracking;binarycaching"
  VCPKG_MAX_CONCURRENCY: 8
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install build tools
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress --limit-output }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) { choco install cmake -y --no-progress --limit-output }
          if (-not (Get-Command ccache -ErrorAction SilentlyContinue)) { choco install ccache -y --no-progress --limit-output }
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) { choco install llvm -y --no-progress --limit-output }

      - name: Setup ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Configure ccache (Windows optimized)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${env:CCACHE_DIR}" | Out-Null
          $ccacheConfPath = Join-Path $env:CCACHE_DIR "ccache.conf"
          @"
          max_size = ${env:CCACHE_MAXSIZE}
          compression = true
          compression_level = 5
          sloppiness = include_file_mtime,time_macros
          base_dir = ${env:GITHUB_WORKSPACE}
          "@ | Out-File -Encoding ascii -FilePath $ccacheConfPath -Force
          "CCACHE_CONFIGPATH=$ccacheConfPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PATH=C:\ProgramData\chocolatey\bin;C:\Program Files\ccache;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CCACHE_BASEDIR=${{ github.workspace }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare vcpkg manifest for CI (remove qtbase)
        shell: pwsh
        run: |
          if (!(Test-Path "vcpkg.json")) {
            Write-Host "No vcpkg.json in repo root — aborting"
            exit 1
          }
          $json = Get-Content vcpkg.json | ConvertFrom-Json
          $json.dependencies = $json.dependencies | Where-Object { $_.name -ne "qtbase" }
          $json | ConvertTo-Json -Depth 10 | Out-File vcpkg.json -Encoding utf8
          
      - name: Setup vcpkg (bootstrap)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: 'bd52fac7114fdaa2208de8dd1227212a6683e562'
          vcpkgGitURL: 'https://github.com/microsoft/vcpkg.git'
          runVcpkgInstall: false

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/archives
          key: ${{ runner.os }}-vcpkg-bin-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json') }}
          restore-keys: ${{ runner.os }}-vcpkg-bin-

      - name: Install Qt6 (from action marketplace)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          install-deps: false
          cache: true

      - name: Locate Qt6 installation
        id: find_qt
        shell: pwsh
        run: |
          $qmake = Get-Command qmake.exe -ErrorAction SilentlyContinue
          if (-not $qmake) {
            Write-Host "qmake not found — aborting."
            exit 1
          }
          $qtDir = Split-Path (Split-Path $qmake.Source)
          Write-Host "Detected Qt dir: $qtDir"
          echo "qt_dir=$qtDir" >> $env:GITHUB_OUTPUT
          echo "Qt6_DIR=$qtDir\lib\cmake\Qt6" >> $env:GITHUB_OUTPUT

      - name: Configure CMake (with MSVC toolchain + vcpkg)
        shell: pwsh
        run: |
          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:VCPKG_ROOT\archives,readwrite"

          cmake -B build -S . `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE:FILEPATH="" `
            -DQt6_DIR="${{ steps.find_qt.outputs['Qt6_DIR'] }}" `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_LINKER=lld-link `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            
      - name: Build project
        shell: pwsh
        run: cmake --build build --parallel

      - name: Prepare release folder
        shell: pwsh
        run: |
          $releaseDir = "release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item "bin\Notesman.exe" $releaseDir\ -Force
          Copy-Item "bin\updater.exe" $releaseDir\ -Force
          $qtBin = "${{ steps.find_qt.outputs.qt_dir }}\bin"
          & "$qtBin\windeployqt.exe" --release --dir $releaseDir "$releaseDir\Notesman.exe"
          if (-not (Test-Path "$releaseDir\Qt6Core.dll")) {
            Write-Error "Qt6 DLLs not found in release folder after windeployqt"
          }

          Remove-Item "$releaseDir\iconengines" -Recurse
          Remove-Item "$releaseDir\translations" -Recurse
          Remove-Item "$releaseDir\generic" -Recurse
          Remove-Item "$releaseDir\styles" -Recurse
          Remove-Item "$releaseDir\opengl32sw.dll" -ErrorAction SilentlyContinue
          Remove-Item "$releaseDir\Qt6Svg.dll" -ErrorAction SilentlyContinue
          Remove-Item "$releaseDir\D3Dcompiler_47.dll" -ErrorAction SilentlyContinue

          $allImagePlugins = Get-ChildItem "$releaseDir\imageformats\" -Filter "*.dll" -ErrorAction SilentlyContinue
          $essentialImagePlugins = @("qico.dll")

          foreach ($plugin in $allImagePlugins) {
            if ($plugin.Name -notin $essentialImagePlugins) {
              Remove-Item $plugin.FullName
              Write-Host "Removed image format plugin: $($plugin.Name)"
            }
          }

      - name: Copy OpenSSL DLLs (Final Optimized)
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ env.VCPKG_ROOT }}"
          $arch = "${{ env.VCPKG_DEFAULT_TRIPLET }}"

          $opensslPackageBin = Join-Path $vcpkgRoot "packages\openssl_$arch\bin"

          $dlls = @("libcrypto-3-x64.dll", "libssl-3-x64.dll")

          foreach ($dll in $dlls) {
            $sourceFile = Join-Path $opensslPackageBin $dll
            if (Test-Path $sourceFile) {
              Copy-Item $sourceFile "release\" -Force
              Write-Host "Copied $dll from official Vcpkg package location: $opensslPackageBin"
            } else {
              Write-Error "CRITICAL: Required $dll not found in $opensslPackageBin."
              exit 1
            }
          }

      - name: Find and copy miniz DLL (optimized)
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ env.VCPKG_ROOT }}"
          $arch = "${{ env.VCPKG_DEFAULT_TRIPLET }}"
          $releaseDir = "release"

          $preferredPath = Join-Path $vcpkgRoot "installed\$arch\bin\miniz.dll"

          if (Test-Path $preferredPath) {
              Write-Host "Found miniz.dll at preferred location: $preferredPath"
              Copy-Item $preferredPath $releaseDir -Force
              Write-Host "Copied miniz.dll to $releaseDir"
          } else {
              Write-Host "Preferred location not found, searching recursively under $vcpkgRoot ..."
              $minizFile = Get-ChildItem -Path $vcpkgRoot -Recurse -Filter "miniz.dll" -ErrorAction SilentlyContinue | Select-Object -First 1

              if ($null -ne $minizFile) {
                  Write-Host "Found miniz.dll at: $($minizFile.FullName)"
                  Copy-Item $minizFile.FullName $releaseDir -Force
                  Write-Host "Copied miniz.dll to $releaseDir"
              } else {
                  Write-Error "miniz.dll not found under $vcpkgRoot"
                  exit 1
              }
          }

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive -Path release\* -DestinationPath "Notesman-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notesman-windows-zip
          path: Notesman-x64.zip

      - name: Extract project version
        id: get_version
        shell: pwsh
        run: |
          if (Test-Path "version.txt") {
            $ver = (Get-Content "version.txt" -Raw).Trim()
          } else {
            $ver = "0.0.0"
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Get existing release body
        id: get_release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_AUTHOR_PAT }}
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'v${{ steps.get_version.outputs.version }}'
              });
              return release.data.body;
            } catch (e) {
              core.setFailed(`Cannot get release: ${e}`);
            }

      - name: Update Windows section in release body
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_AUTHOR_PAT }}
          script: |
            let body = `${{ steps.get_release.outputs.result }}`;
            if (!body) body = "**Notesman v${{ steps.get_version.outputs.version }}**\n\n";

            body = body.replace(/^"+|"+$/g, '');

            body = body.replace(/<!-- WINDOWS_SECTION_START -->[\s\S]*?<!-- WINDOWS_SECTION_END -->/, `
            <!-- WINDOWS_SECTION_START -->
            **Windows Build**
            - Windows ZIP/executable included
            <!-- WINDOWS_SECTION_END -->
            `);

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: 'v${{ steps.get_version.outputs.version }}'
            });

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              body: body
            });

      - name: Upload Windows assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          files: Notesman-x64.zip
          token: ${{ secrets.RELEASE_AUTHOR_PAT }}
          fail_on_unmatched_files: false
