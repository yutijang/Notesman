name: (SINGLE JOB) Windows - Build & Release

on:
  workflow_run:
    workflows: ["Tag trigger"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows
  CCACHE_DIR: ${{ github.workspace }}\.ccache
  CCACHE_MAXSIZE: 500M
  VCPKG_KEEP_ENV_VARS: "CCACHE_DIR;CCACHE_BASEDIR;CCACHE_CONFIGPATH"
  VCPKG_FEATURE_FLAGS: "manifests;compilertracking;binarycaching"
  VCPKG_MAX_CONCURRENCY: 8
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install build tools
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress --limit-output }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) { choco install cmake -y --no-progress --limit-output }
          if (-not (Get-Command ccache -ErrorAction SilentlyContinue)) { choco install ccache -y --no-progress --limit-output }
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) { choco install llvm -y --no-progress --limit-output }

      - name: Install pkg-config
        run: choco install pkgconfiglite --allow-empty-checksums -y

      - name: Setup ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Configure ccache (Windows optimized)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${env:CCACHE_DIR}" | Out-Null
          $ccacheConfPath = Join-Path $env:CCACHE_DIR "ccache.conf"
          @"
          max_size = ${env:CCACHE_MAXSIZE}
          compression = true
          compression_level = 5
          sloppiness = include_file_mtime,time_macros
          base_dir = ${env:GITHUB_WORKSPACE}
          "@ | Out-File -Encoding ascii -FilePath $ccacheConfPath -Force
          "CCACHE_CONFIGPATH=$ccacheConfPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PATH=C:\ProgramData\chocolatey\bin;C:\Program Files\ccache;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CCACHE_BASEDIR=${{ github.workspace }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare vcpkg manifest for CI (remove qtbase)
        shell: pwsh
        run: |
          if (!(Test-Path "vcpkg.json")) {
            Write-Host "No vcpkg.json in repo root — aborting"
            exit 1
          }
          $json = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          
          $json.dependencies = $json.dependencies | Where-Object {
              if ($_ -is [string]) {
                  return $_ -ne "qtsvg"
              }

              if ($_.name) {
                  return $_.name -ne "qtbase"
              }
              return $true
          }

          $json | ConvertTo-Json -Depth 10 | Out-File vcpkg.json -Encoding utf8
          
      - name: Setup vcpkg (bootstrap)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: 'b8927a1f9dd394496414668e1d2f94b2559d45a8'
          vcpkgGitURL: 'https://github.com/microsoft/vcpkg.git'
          runVcpkgInstall: false

      - name: Prepare vcpkg cache directories
        shell: pwsh
        run: |
          $cacheDir = "${{ env.VCPKG_ROOT }}/archives"
          if (!(Test-Path $cacheDir)) {
            New-Item -Path $cacheDir -ItemType Directory -Force
          }

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/archives
          key: ${{ runner.os }}-vcpkg-bin-${{ hashFiles('vcpkg.json') }}
          restore-keys: ${{ runner.os }}-vcpkg-bin-

      - name: Install Qt6 (from action marketplace)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          install-deps: false
          archives: 'qtbase qtsvg'
          cache: true

      - name: Locate Qt6 installation
        id: find_qt
        shell: pwsh
        run: |
          $qmake = Get-Command qmake.exe -ErrorAction SilentlyContinue
          if (-not $qmake) {
            Write-Host "qmake not found — aborting."
            exit 1
          }
          $qtDir = Split-Path (Split-Path $qmake.Source)
          Write-Host "Detected Qt dir: $qtDir"
          echo "qt_dir=$qtDir" >> $env:GITHUB_OUTPUT
          echo "Qt6_DIR=$qtDir\lib\cmake\Qt6" >> $env:GITHUB_OUTPUT

      - name: Configure CMake (with MSVC toolchain + vcpkg)
        shell: pwsh
        run: |
          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:VCPKG_ROOT\archives,readwrite"

          cmake -B build -S . `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE:FILEPATH="" `
            -DQt6_DIR="${{ steps.find_qt.outputs['Qt6_DIR'] }}" `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_LINKER=lld-link `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            
      - name: Build project
        shell: pwsh
        run: cmake --build build --parallel

      - name: Set RELEASE_DIR
        shell: pwsh
        run: |
          echo "RELEASE_DIR=release\Notesman-x64" >> $env:GITHUB_ENV

      - name: Prepare release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ${{ env.RELEASE_DIR }} | Out-Null
          Copy-Item "bin\Notesman.exe" ${{ env.RELEASE_DIR }}\ -Force
          Copy-Item "bin\NotesmanCore.dll" ${{ env.RELEASE_DIR }}\ -Force
          Copy-Item "bin\updater.exe" ${{ env.RELEASE_DIR }}\ -Force
          $qtBin = "${{ steps.find_qt.outputs.qt_dir }}\bin"
          & "$qtBin\windeployqt.exe" --release --dir ${{ env.RELEASE_DIR }} "${{ env.RELEASE_DIR }}\NotesmanCore.dll"
          if (-not (Test-Path "${{ env.RELEASE_DIR }}\Qt6Core.dll")) {
            Write-Error "Qt6 DLLs not found in release folder after windeployqt"
          }

          Remove-Item "${{ env.RELEASE_DIR }}\iconengines" -Recurse
          Remove-Item "${{ env.RELEASE_DIR }}\translations" -Recurse
          Remove-Item "${{ env.RELEASE_DIR }}\generic" -Recurse
          Remove-Item "${{ env.RELEASE_DIR }}\styles" -Recurse
          Remove-Item "${{ env.RELEASE_DIR }}\opengl32sw.dll" -ErrorAction SilentlyContinue
          Remove-Item "${{ env.RELEASE_DIR }}\D3Dcompiler_47.dll" -ErrorAction SilentlyContinue

          $allImagePlugins = Get-ChildItem "${{ env.RELEASE_DIR }}\imageformats\" -Filter "*.dll" -ErrorAction SilentlyContinue
          $essentialImagePlugins = @("qico.dll")

          foreach ($plugin in $allImagePlugins) {
            if ($plugin.Name -notin $essentialImagePlugins) {
              Remove-Item $plugin.FullName
              Write-Host "Removed image format plugin: $($plugin.Name)"
            }
          }

      - name: Copy OpenSSL DLLs (Final Optimized)
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ env.VCPKG_ROOT }}"
          $arch = "${{ env.VCPKG_DEFAULT_TRIPLET }}"

          $opensslPackageBin = Join-Path $vcpkgRoot "packages\openssl_$arch\bin"

          $dlls = @("libcrypto-3-x64.dll", "libssl-3-x64.dll")

          foreach ($dll in $dlls) {
            $sourceFile = Join-Path $opensslPackageBin $dll
            if (Test-Path $sourceFile) {
              Copy-Item $sourceFile ${{ env.RELEASE_DIR }}\ -Force
              Write-Host "Copied $dll from official Vcpkg package location: $opensslPackageBin"
            } else {
              Write-Error "CRITICAL: Required $dll not found in $opensslPackageBin."
              exit 1
            }
          }

      - name: Find and copy fmt.dll and spdlog.dll
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ env.VCPKG_ROOT }}"
          $arch = "${{ env.VCPKG_DEFAULT_TRIPLET }}"
          $dllNames = @("fmt.dll", "spdlog.dll")

          foreach ($dll in $dllNames) {
              $preferredPath = Join-Path $vcpkgRoot "installed\$arch\bin\$dll"
              if (Test-Path $preferredPath) {
                  Write-Host "Found $dll at preferred location: $preferredPath"
                  Copy-Item $preferredPath ${{ env.RELEASE_DIR }} -Force
                  Write-Host "Copied $dll to ${{ env.RELEASE_DIR }}"
              } else {
                  Write-Host "Preferred location for $dll not found, searching recursively under $vcpkgRoot ..."
                  $dllFile = Get-ChildItem -Path $vcpkgRoot -Recurse -Filter $dll -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($null -ne $dllFile) {
                      Write-Host "Found $dll at: $($dllFile.FullName)"
                      Copy-Item $dllFile.FullName ${{ env.RELEASE_DIR }} -Force
                      Write-Host "Copied $dll to ${{ env.RELEASE_DIR }}"
                  } else {
                      Write-Error "$dll not found under $vcpkgRoot"
                      exit 1
                  }
              }
          }

      - name: Find and copy sqlite3.dll
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ env.VCPKG_ROOT }}"
          $arch = "${{ env.VCPKG_DEFAULT_TRIPLET }}"
          $dllName = "sqlite3.dll"

          $preferredPath = Join-Path $vcpkgRoot "installed\$arch\bin\$dllName"
          if (Test-Path $preferredPath) {
              Write-Host "Found $dllName at preferred location: $preferredPath"
              Copy-Item $preferredPath ${{ env.RELEASE_DIR }} -Force
              Write-Host "Copied $dllName to ${{ env.RELEASE_DIR }}"
          } else {
              Write-Host "Preferred location for $dllName not found, searching recursively under $vcpkgRoot ..."
              $dllFile = Get-ChildItem -Path $vcpkgRoot -Recurse -Filter $dllName -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($null -ne $dllFile) {
                  Write-Host "Found $dllName at: $($dllFile.FullName)"
                  Copy-Item $dllFile.FullName ${{ env.RELEASE_DIR }} -Force
                  Write-Host "Copied $dllName to ${{ env.RELEASE_DIR }}"
              } else {
                  Write-Error "$dllName not found under $vcpkgRoot"
                  exit 1
              }
          }

      - name: Find and copy miniz DLL (optimized)
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ env.VCPKG_ROOT }}"
          $arch = "${{ env.VCPKG_DEFAULT_TRIPLET }}"

          $preferredPath = Join-Path $vcpkgRoot "installed\$arch\bin\miniz.dll"

          if (Test-Path $preferredPath) {
              Write-Host "Found miniz.dll at preferred location: $preferredPath"
              Copy-Item $preferredPath ${{ env.RELEASE_DIR }} -Force
              Write-Host "Copied miniz.dll to ${{ env.RELEASE_DIR }}"
          } else {
              Write-Host "Preferred location not found, searching recursively under $vcpkgRoot ..."
              $minizFile = Get-ChildItem -Path $vcpkgRoot -Recurse -Filter "miniz.dll" -ErrorAction SilentlyContinue | Select-Object -First 1

              if ($null -ne $minizFile) {
                  Write-Host "Found miniz.dll at: $($minizFile.FullName)"
                  Copy-Item $minizFile.FullName ${{ env.RELEASE_DIR }} -Force
                  Write-Host "Copied miniz.dll to ${{ env.RELEASE_DIR }}"
              } else {
                  Write-Error "miniz.dll not found under $vcpkgRoot"
                  exit 1
              }
          }

      - name: Find and copy poppler dependents
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ env.VCPKG_ROOT }}"
          $arch = "${{ env.VCPKG_DEFAULT_TRIPLET }}"
          $dllNames = @("poppler.dll", "poppler-cpp.dll", "iconv-2.dll", "openjp2.dll", "jpeg62.dll", "libpng16.dll", "tiff.dll", "freetype.dll", "liblzma.dll", "brotlidec.dll", "bz2.dll", "brotlicommon.dll")

          foreach ($dll in $dllNames) {
              $preferredPath = Join-Path $vcpkgRoot "installed\$arch\bin\$dll"
              if (Test-Path $preferredPath) {
                  Write-Host "Found $dll at preferred location: $preferredPath"
                  Copy-Item $preferredPath ${{ env.RELEASE_DIR }} -Force
                  Write-Host "Copied $dll to ${{ env.RELEASE_DIR }}"
              } else {
                  Write-Host "Preferred location for $dll not found, searching recursively under $vcpkgRoot ..."
                  $dllFile = Get-ChildItem -Path $vcpkgRoot -Recurse -Filter $dll -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($null -ne $dllFile) {
                      Write-Host "Found $dll at: $($dllFile.FullName)"
                      Copy-Item $dllFile.FullName ${{ env.RELEASE_DIR }} -Force
                      Write-Host "Copied $dll to ${{ env.RELEASE_DIR }}"
                  } else {
                      Write-Error "$dll not found under $vcpkgRoot"
                      exit 1
                  }
              }
          }

      - name: Find and copy md4c dependents
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ env.VCPKG_ROOT }}"
          $arch = "${{ env.VCPKG_DEFAULT_TRIPLET }}"
          $dllNames = @("md4c.dll", "md4c-html.dll")

          foreach ($dll in $dllNames) {
              $preferredPath = Join-Path $vcpkgRoot "installed\$arch\bin\$dll"
              if (Test-Path $preferredPath) {
                  Write-Host "Found $dll at preferred location: $preferredPath"
                  Copy-Item $preferredPath ${{ env.RELEASE_DIR }} -Force
                  Write-Host "Copied $dll to ${{ env.RELEASE_DIR }}"
              } else {
                  Write-Host "Preferred location for $dll not found, searching recursively under $vcpkgRoot ..."
                  $dllFile = Get-ChildItem -Path $vcpkgRoot -Recurse -Filter $dll -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($null -ne $dllFile) {
                      Write-Host "Found $dll at: $($dllFile.FullName)"
                      Copy-Item $dllFile.FullName ${{ env.RELEASE_DIR }} -Force
                      Write-Host "Copied $dll to ${{ env.RELEASE_DIR }}"
                  } else {
                      Write-Error "$dll not found under $vcpkgRoot"
                      exit 1
                  }
              }
          }

      - name: Find and copy WebView2Loader DLL
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ env.VCPKG_ROOT }}"
          $arch = "${{ env.VCPKG_DEFAULT_TRIPLET }}"

          $preferredPath = Join-Path $vcpkgRoot "installed\$arch\bin\WebView2Loader.dll"

          if (Test-Path $preferredPath) {
              Write-Host "Found WebView2Loader.dll at preferred location: $preferredPath"
              Copy-Item $preferredPath ${{ env.RELEASE_DIR }} -Force
              Write-Host "Copied WebView2Loader.dll to ${{ env.RELEASE_DIR }}"
          } else {
              Write-Host "Preferred location not found, searching recursively under $vcpkgRoot ..."
              $WebView2LoaderFile = Get-ChildItem -Path $vcpkgRoot -Recurse -Filter "WebView2Loader.dll" -ErrorAction SilentlyContinue | Select-Object -First 1

              if ($null -ne $WebView2LoaderFile) {
                  Write-Host "Found WebView2Loader.dll at: $($WebView2LoaderFile.FullName)"
                  Copy-Item $WebView2LoaderFile.FullName ${{ env.RELEASE_DIR }} -Force
                  Write-Host "Copied WebView2Loader.dll to ${{ env.RELEASE_DIR }}"
              } else {
                  Write-Error "WebView2Loader.dll not found under $vcpkgRoot"
                  exit 1
              }
          }

      - name: Force Deploy zlib1.dll from vcpkg
        shell: pwsh
        run: |
          $searchDir = "${{ github.workspace }}"
          $releaseDir = "${{ env.RELEASE_DIR }}"
          
          Write-Host "Searching for zlib DLLs in workspace: $searchDir"
          
          $dll = Get-ChildItem -Path $searchDir -Filter "zlib*.dll" -Recurse -ErrorAction SilentlyContinue | 
                 Where-Object { $_.FullName -like "*\bin\*" -and $_.FullName -notlike "*\debug\*" } | 
                 Select-Object -First 1

          if ($null -ne $dll) {
              Write-Host "Found zlib at: $($dll.FullName)"
              if (-not (Test-Path $releaseDir)) { New-Item -ItemType Directory -Path $releaseDir -Force }
              
              Copy-Item $dll.FullName (Join-Path $releaseDir "zlib1.dll") -Force
              Write-Host "Deployed $($dll.Name) as zlib1.dll to $releaseDir"
          } else {
              Write-Error "CRITICAL: vcpkg did not build zlib DLL. Check if your vcpkg triplet is set to dynamic (x64-windows)."
              Get-ChildItem -Path $searchDir -Filter "*.dll" -Recurse | Select-Object FullName
              exit 1
          }

      - name: Download and package VC Redistributable
        shell: pwsh
        run: |
          $vcredistPath = Join-Path "${{ env.RELEASE_DIR }}" "VCRedist"
          New-Item -ItemType Directory -Force -Path $vcredistPath | Out-Null
          
          $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $output = Join-Path $vcredistPath "vc_redist.x64.exe"
          
          Write-Host "Downloading VC Redistributable from $url..."
          Invoke-WebRequest -Uri $url -OutFile $output
          
          if (Test-Path $output) {
            Write-Host "Successfully downloaded vc_redist.x64.exe to VCRedist folder."
          } else {
            Write-Error "Failed to download VC Redistributable."
            exit 1
          }

      - name: Extract project version
        id: get_version
        shell: pwsh
        run: |
          $version = "0.0.0"

          if (Test-Path "version.txt") {
            $line = Get-Content "version.txt" | Where-Object { $_ -match '^APP=' } | Select-Object -First 1
            if ($line) {
              $version = ($line -replace '^APP=', '').Trim()
            }
          }

          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create ZIP package
        id: zip
        shell: pwsh
        run: |
          $zipName = "Notesman-x64-v${{ steps.get_version.outputs.version }}.zip"
          Compress-Archive -Path ${{ env.RELEASE_DIR }} -DestinationPath $zipName -Force
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notesman-windows-zip
          path: ${{ steps.zip.outputs.zip_name }}
          retention-days: 1

      - name: Get existing release body
        id: get_release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_AUTHOR_PAT }}
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'v${{ steps.get_version.outputs.version }}'
              });
              return release.data.body;
            } catch (e) {
              core.setFailed(`Cannot get release: ${e}`);
            }

      - name: Update Windows section in release body
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_AUTHOR_PAT }}
          script: |
            let body = `${{ steps.get_release.outputs.result }}`;
            if (!body) body = "**Notesman v${{ steps.get_version.outputs.version }}**\n\n";

            body = body.replace(/^"+|"+$/g, '');

            body = body.replace(/<!-- WINDOWS_SECTION_START -->[\s\S]*?<!-- WINDOWS_SECTION_END -->/, `
            <!-- WINDOWS_SECTION_START -->
            **Windows Build**
            - Windows ZIP/executable included
            - Microsoft Visual C++ Redistributable included (VCRedist folder)
            <!-- WINDOWS_SECTION_END -->
            `);

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: 'v${{ steps.get_version.outputs.version }}'
            });

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              body: body
            });

      - name: Upload Windows assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          files: ${{ steps.zip.outputs.zip_name }}
          token: ${{ secrets.RELEASE_AUTHOR_PAT }}
          fail_on_unmatched_files: false
