name: (SINGLE JOB) Windows - Build & Release

on:
  workflow_run:
    workflows: ["Tag trigger"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows
  CCACHE_DIR: ${{ github.workspace }}\.ccache
  CCACHE_MAXSIZE: 500M
  VCPKG_KEEP_ENV_VARS: "CCACHE_DIR;CCACHE_BASEDIR;CCACHE_CONFIGPATH"
  VCPKG_FEATURE_FLAGS: "manifests;compilertracking;binarycaching"
  VCPKG_MAX_CONCURRENCY: 8
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install build tools
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress --limit-output }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) { choco install cmake -y --no-progress --limit-output }
          if (-not (Get-Command ccache -ErrorAction SilentlyContinue)) { choco install ccache -y --no-progress --limit-output }
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) { choco install llvm -y --no-progress --limit-output }

      - name: Install pkg-config
        run: choco install pkgconfiglite --allow-empty-checksums -y

      - name: Setup ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Configure ccache (Windows optimized)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${env:CCACHE_DIR}" | Out-Null
          $ccacheConfPath = Join-Path $env:CCACHE_DIR "ccache.conf"
          @"
          max_size = ${env:CCACHE_MAXSIZE}
          compression = true
          compression_level = 5
          sloppiness = include_file_mtime,time_macros
          base_dir = ${env:GITHUB_WORKSPACE}
          "@ | Out-File -Encoding ascii -FilePath $ccacheConfPath -Force
          "CCACHE_CONFIGPATH=$ccacheConfPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PATH=C:\ProgramData\chocolatey\bin;C:\Program Files\ccache;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CCACHE_BASEDIR=${{ github.workspace }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare vcpkg manifest for CI (remove qtbase)
        shell: pwsh
        run: |
          if (!(Test-Path "vcpkg.json")) {
            Write-Host "No vcpkg.json in repo root — aborting"
            exit 1
          }
          $json = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          
          $json.dependencies = $json.dependencies | Where-Object {
              if ($_ -is [string]) {
                  return $_ -ne "qtsvg"
              }

              if ($_.name) {
                  return $_.name -ne "qtbase"
              }
              return $true
          }

          $json | ConvertTo-Json -Depth 10 | Out-File vcpkg.json -Encoding utf8
          
      - name: Setup vcpkg (bootstrap)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: 'b8927a1f9dd394496414668e1d2f94b2559d45a8'
          vcpkgGitURL: 'https://github.com/microsoft/vcpkg.git'
          runVcpkgInstall: false

      - name: Prepare vcpkg cache directories
        shell: pwsh
        run: |
          $cacheDir = "${{ env.VCPKG_ROOT }}/archives"
          if (!(Test-Path $cacheDir)) {
            New-Item -Path $cacheDir -ItemType Directory -Force
          }

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/archives
          key: ${{ runner.os }}-vcpkg-bin-${{ hashFiles('vcpkg.json') }}
          restore-keys: ${{ runner.os }}-vcpkg-bin-

      - name: Install Qt6 (from action marketplace)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          install-deps: false
          archives: 'qtbase qtsvg'
          cache: true

      - name: Locate Qt6 installation
        id: find_qt
        shell: pwsh
        run: |
          $qmake = Get-Command qmake.exe -ErrorAction SilentlyContinue
          if (-not $qmake) {
            Write-Host "qmake not found — aborting."
            exit 1
          }
          $qtDir = Split-Path (Split-Path $qmake.Source)
          Write-Host "Detected Qt dir: $qtDir"
          echo "qt_dir=$qtDir" >> $env:GITHUB_OUTPUT
          echo "Qt6_DIR=$qtDir\lib\cmake\Qt6" >> $env:GITHUB_OUTPUT

      - name: Configure CMake (with MSVC toolchain + vcpkg)
        shell: pwsh
        run: |
          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:VCPKG_ROOT\archives,readwrite"

          cmake -B build -S . `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE:FILEPATH="" `
            -DQt6_DIR="${{ steps.find_qt.outputs['Qt6_DIR'] }}" `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_LINKER=lld-link `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            
      - name: Build project
        shell: pwsh
        run: cmake --build build --parallel

      - name: Set RELEASE_DIR
        shell: pwsh
        run: |
          echo "RELEASE_DIR=release\Notesman-x64" >> $env:GITHUB_ENV

      - name: Prepare release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ${{ env.RELEASE_DIR }} | Out-Null
          Copy-Item "bin\Notesman.exe" ${{ env.RELEASE_DIR }}\ -Force
          Copy-Item "bin\NotesmanCore.dll" ${{ env.RELEASE_DIR }}\ -Force
          Copy-Item "bin\updater.exe" ${{ env.RELEASE_DIR }}\ -Force
          $qtBin = "${{ steps.find_qt.outputs.qt_dir }}\bin"
          & "$qtBin\windeployqt.exe" --release --dir ${{ env.RELEASE_DIR }} "${{ env.RELEASE_DIR }}\NotesmanCore.dll"
          if (-not (Test-Path "${{ env.RELEASE_DIR }}\Qt6Core.dll")) {
            Write-Error "Qt6 DLLs not found in release folder after windeployqt"
          }

          Remove-Item "${{ env.RELEASE_DIR }}\iconengines" -Recurse
          Remove-Item "${{ env.RELEASE_DIR }}\translations" -Recurse
          Remove-Item "${{ env.RELEASE_DIR }}\generic" -Recurse
          Remove-Item "${{ env.RELEASE_DIR }}\styles" -Recurse
          Remove-Item "${{ env.RELEASE_DIR }}\opengl32sw.dll" -ErrorAction SilentlyContinue
          Remove-Item "${{ env.RELEASE_DIR }}\D3Dcompiler_47.dll" -ErrorAction SilentlyContinue

          $allImagePlugins = Get-ChildItem "${{ env.RELEASE_DIR }}\imageformats\" -Filter "*.dll" -ErrorAction SilentlyContinue
          $essentialImagePlugins = @("qico.dll")

          foreach ($plugin in $allImagePlugins) {
            if ($plugin.Name -notin $essentialImagePlugins) {
              Remove-Item $plugin.FullName
              Write-Host "Removed image format plugin: $($plugin.Name)"
            }
          }

      # This step intentionally collects a manually curated list of runtime DLLs.
      # Dependencies are identified from real runtime execution, not inferred.
      # Any missing DLL is considered a release-breaking error.
      - name: Strict collect and verify all dependency DLLs
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ env.VCPKG_ROOT }}"
          $arch = "${{ env.VCPKG_DEFAULT_TRIPLET }}"
          $releaseDir = "${{ env.RELEASE_DIR }}"
          $packagesDir = Join-Path $vcpkgRoot "packages"

          $artifacts = @(
              @{ pkg = "webview2"; filter = "WebView2Loader.dll" },
              @{ pkg = "md4c"; filter = "md4c*.dll" },
              @{ pkg = "poppler"; filter = "poppler*.dll" },
              @{ pkg = "libiconv"; filter = "iconv-2.dll" },
              @{ pkg = "openjpeg"; filter = "openjp2.dll" },
              @{ pkg = "libjpeg-turbo"; filter = "jpeg62.dll" },
              @{ pkg = "libpng"; filter = "libpng16.dll" },
              @{ pkg = "tiff"; filter = "tiff.dll" },
              @{ pkg = "freetype"; filter = "freetype.dll" },
              @{ pkg = "liblzma"; filter = "liblzma.dll" },
              @{ pkg = "brotli"; filter = "brotli*.dll" },
              @{ pkg = "bzip2"; filter = "bz2.dll" },
              @{ pkg = "fmt"; filter = "fmt.dll" },
              @{ pkg = "spdlog"; filter = "spdlog.dll" },
              @{ pkg = "sqlite3"; filter = "sqlite3.dll" },
              @{ pkg = "miniz"; filter = "miniz.dll" },
              @{ pkg = "openssl"; filter = "lib*.dll" },
              @{ pkg = "zlib"; filter = "zlib1.dll" },
              @{ pkg = "boost-url"; filter = "boost_url*.dll" },
              @{ pkg = "lipzip"; filter = "zip.dll" }
          )

          $missingArtifacts = @()

          foreach ($item in $artifacts) {
              $pkgName = "$($item.pkg)_$arch"
              $targetBin = Join-Path $packagesDir "$pkgName\bin"
              $found = $false
              
              Write-Host "--------------------------------------------------"
              Write-Host "Processing package: $pkgName"

              if (Test-Path $targetBin) {
                  $files = Get-ChildItem -Path $targetBin -Filter $item.filter -ErrorAction SilentlyContinue
                  
                  if ($null -ne $files -and $files.Count -gt 0) {
                      foreach ($file in $files) {
                          Write-Host "Found and copying: $($file.Name)"
                          Copy-Item $file.FullName $releaseDir -Force
                      }
                      $found = $true
                  }
              }

              if (-not $found) {
                  Write-Error "CRITICAL: Could not find any files matching '$($item.filter)' in $targetBin"
                  $missingArtifacts += $pkgName
              }
          }

          Write-Host "--------------------------------------------------"
          if ($missingArtifacts.Count -gt 0) {
              Write-Error "Build failed: The following mandatory packages are missing DLLs: $($missingArtifacts -join ', ')"
              exit 1
          } else {
              Write-Host "Success: All mandatory DLLs have been collected and verified."
          }

      - name: Download and package VC Redistributable
        shell: pwsh
        run: |
          $vcredistPath = Join-Path "${{ env.RELEASE_DIR }}" "VCRedist"
          New-Item -ItemType Directory -Force -Path $vcredistPath | Out-Null
          
          $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $output = Join-Path $vcredistPath "vc_redist.x64.exe"
          
          Write-Host "Downloading VC Redistributable from $url..."
          Invoke-WebRequest -Uri $url -OutFile $output
          
          if (Test-Path $output) {
            Write-Host "Successfully downloaded vc_redist.x64.exe to VCRedist folder."
          } else {
            Write-Error "Failed to download VC Redistributable."
            exit 1
          }

      - name: Extract project version
        id: get_version
        shell: pwsh
        run: |
          $version = "0.0.0"

          if (Test-Path "version.txt") {
            $line = Get-Content "version.txt" | Where-Object { $_ -match '^APP=' } | Select-Object -First 1
            if ($line) {
              $version = ($line -replace '^APP=', '').Trim()
            }
          }

          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create ZIP package
        id: zip
        shell: pwsh
        run: |
          $zipName = "Notesman-x64-v${{ steps.get_version.outputs.version }}.zip"
          Compress-Archive -Path ${{ env.RELEASE_DIR }} -DestinationPath $zipName -Force
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notesman-windows-zip
          path: ${{ steps.zip.outputs.zip_name }}
          retention-days: 1

      - name: Get existing release body
        id: get_release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_AUTHOR_PAT }}
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'v${{ steps.get_version.outputs.version }}'
              });
              return release.data.body;
            } catch (e) {
              core.setFailed(`Cannot get release: ${e}`);
            }

      - name: Update Windows section in release body
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_AUTHOR_PAT }}
          script: |
            let body = `${{ steps.get_release.outputs.result }}`;
            if (!body) body = "**Notesman v${{ steps.get_version.outputs.version }}**\n\n";

            body = body.replace(/^"+|"+$/g, '');

            body = body.replace(/<!-- WINDOWS_SECTION_START -->[\s\S]*?<!-- WINDOWS_SECTION_END -->/, `
            <!-- WINDOWS_SECTION_START -->
            **Windows Build**
            - Windows ZIP/executable included
            - Microsoft Visual C++ Redistributable included (VCRedist folder)
            <!-- WINDOWS_SECTION_END -->
            `);

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: 'v${{ steps.get_version.outputs.version }}'
            });

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              body: body
            });

      - name: Upload Windows assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          files: ${{ steps.zip.outputs.zip_name }}
          token: ${{ secrets.RELEASE_AUTHOR_PAT }}
          fail_on_unmatched_files: false
