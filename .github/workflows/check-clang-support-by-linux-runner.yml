name: Modern C++ Environment
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LLVM_VER: 22
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/Clang ${{ env.LLVM_VER }}
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VER }} all
          
          sudo apt-get install -y \
            libc++-${{ env.LLVM_VER }}-dev \
            libc++abi-${{ env.LLVM_VER }}-dev

      - name: Verify Toolchain
        run: |
          clang++-${{ env.LLVM_VER }} --version
          
          cat <<EOF > test_feature.cpp
          #include <print>
          #include <vector>
          #include <expected>

          int main() {
              std::print("Compiler: Clang ${{ env.LLVM_VER }}\n");
              std::print("Standard: C++26 Ready\n");
              
              std::expected<int, const char*> res = 42;
              if (res) std::print("Value: {}\n", *res);
              
              return 0;
          }
          EOF

          clang++-${{ env.LLVM_VER }} -std=c++26 \
            -stdlib=libc++ \
            -lc++ -lc++abi \
            test_feature.cpp -o test_bin

          ./test_bin