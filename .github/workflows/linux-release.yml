name: Build & Release (Linux)

on:
  workflow_run:
    workflows: ["Tag trigger"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-linux
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
  VCPKG_KEEP_ENV_VARS: "CCACHE_DIR;CCACHE_BASEDIR;CCACHE_CONFIGPATH"
  VCPKG_FEATURE_FLAGS: "manifests;compilertracking;binarycaching"
  VCPKG_MAX_CONCURRENCY: 8
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install apt packages (build tools)
        run: |
          sudo add-apt-repository -y universe

          sudo apt-get update -y && \
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            jq curl unzip zip ccache patchelf rsync libgl1-mesa-dev \
            libsecret-1-dev

      - name: Fix Clang version to 18
        run: |
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Setup ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Configure ccache (safe + CI optimized)
        run: |
          mkdir -p "${CCACHE_DIR}"
          printf '%s\n' \
            "max_size = ${CCACHE_MAXSIZE}" \
            "compression = true" \
            "compression_level = 5" \
            "sloppiness = include_file_mtime,time_macros" \
            "base_dir = ${GITHUB_WORKSPACE}" \
            > "${CCACHE_DIR}/ccache.conf"
            
          echo "CCACHE_CONFIGPATH=${CCACHE_DIR}/ccache.conf" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> $GITHUB_ENV

      - name: Prepare vcpkg manifest (remove qtbase directly)
        run: |
          if [ ! -f vcpkg.json ]; then
            echo "No vcpkg.json in repo root — aborting"
            exit 1
          fi
          tmp=$(mktemp)
          jq 'del(.dependencies[] | select((type == "object" and .name == "qtbase") or (. == "qtsvg")))' vcpkg.json > "$tmp" && mv "$tmp" vcpkg.json

      - name: Setup vcpkg (bootstrap)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: 'b8927a1f9dd394496414668e1d2f94b2559d45a8'
          vcpkgGitURL: 'https://github.com/microsoft/vcpkg.git'
          runVcpkgInstall: false

      - name: Prepare vcpkg cache directories
        run: |
          mkdir -p "${{ env.VCPKG_ROOT }}/archives"

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/archives
          key: ${{ runner.os }}-vcpkg-asset-${{ hashFiles('vcpkg.json') }}
          restore-keys: ${{ runner.os }}-vcpkg-asset-

      - name: Install Qt6 (from action marketplace) - Shared libs
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          install-deps: true
          archives: 'qtbase qtsvg'
          cache: true

      - name: Locate Qt6 installation
        id: find_qt
        run: |
          QT_BIN=$(which qmake-qt6 2>/dev/null || which qmake 2>/dev/null || true)
          if [ -z "$QT_BIN" ]; then
            QT_CMAKE_DIR=$(find $HOME /opt -type d -path "*/Qt*/6*/*/lib/cmake/Qt6" 2>/dev/null | head -n1 || true)
            if [ -z "$QT_CMAKE_DIR" ]; then
              echo "Could not detect Qt installation automatically. Aborting."
              exit 1
            fi
            QT_DIR=$(dirname $(dirname "$QT_CMAKE_DIR"))
          else
            QT_DIR=$(dirname $(dirname "$QT_BIN"))
          fi
          echo "qt_bin=$QT_BIN" >> $GITHUB_OUTPUT
          echo "qt_dir=$QT_DIR" >> $GITHUB_OUTPUT
          echo "Qt6_DIR=${QT_DIR}/lib/cmake/Qt6" >> $GITHUB_OUTPUT

      - name: Export Qt tools into PATH
        run: |
          echo "${{ steps.find_qt.outputs.qt_dir }}/bin" >> $GITHUB_PATH

          which qtpaths || true
          qtpaths --query QT_VERSION || true

      - name: Setup vcpkg binary cache path
        run: |
          ABS_ARCHIVES=$(realpath "${VCPKG_ROOT}/archives")
          echo "ABS_ARCHIVES=${ABS_ARCHIVES}" >> $GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;files,${ABS_ARCHIVES},readwrite" >> $GITHUB_ENV

      - name: Configure CMake (use vcpkg toolchain and Qt6 dir)
        run: |
          echo "Using VCPKG_BINARY_SOURCES=${VCPKG_BINARY_SOURCES}"

          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
            -DQt6_DIR="${{ steps.find_qt.outputs['Qt6_DIR'] }}" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
          CCACHE_DIR: ${{ env.CCACHE_DIR }}
          CCACHE_CONFIGPATH: ${{ env.CCACHE_DIR }}/ccache.conf
          
      - name: Build (parallel)
        run: cmake --build build --parallel

      - name: Prepare AppDir for linuxdeployqt
        run: |
          set -e
          APPDIR=AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib"
          if [ -f ./bin/Notesman ]; then
            cp ./bin/Notesman "$APPDIR/usr/bin/Notesman"
          else
            echo "Built binary not found in ./bin or build/ - adjust paths"
            ls -la ./bin || true
            ls -la build || true
            exit 1
          fi
          cat > "$APPDIR/Notesman.desktop" <<'EOF'
          [Desktop Entry]
          Name=Notesman
          Exec=Notesman
          Icon=notesman
          Type=Application
          Categories=Utility;
          EOF
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -v apps/notesman/resources/icons/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/notesman.png" || true

      - name: Add updater into AppDir
        run: |
          set -e
          APPDIR=AppDir

          if [ ! -f bin/updater ]; then
            echo "updater not found! Listing bin directory..."
            ls -la bin
            exit 1
          fi

          mkdir -p "$APPDIR/usr/bin"
          cp bin/updater "$APPDIR/usr/bin/updater"

          chmod +x "$APPDIR/usr/bin/updater"

      - name: Download linuxdeploy and plugin-qt
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Install Qt runtime dependencies for AppImage
        run: |
          sudo apt-get install -y \
            libxcb1 libxcb-cursor0 libx11-6 libx11-xcb1 libxext6 libxrender1 libxi6 \
            libxrandr2 libxfixes3 libxrender1 libxkbcommon0 libglu1-mesa libfontconfig1 \
            libfreetype6 libdbus-1-3 libglib2.0-0

      - name: Bundle Qt6 app into AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e AppDir/usr/bin/Notesman \
            -d AppDir/Notesman.desktop \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/notesman.png \
            --plugin qt

      - name: Remove unused Qt files from AppDir
        run: |
          set -e
          APPDIR=AppDir/usr
          [ -d "$APPDIR" ] || { echo "AppDir not found"; exit 1; }

          echo "Cleaning unused Qt modules and plugins..."

          rm -rf "$APPDIR/plugins/platforminputcontexts" || true
          rm -rf "$APPDIR/plugins/platformthemes" || true
          rm -rf "$APPDIR/share/doc" || true
          rm -rf "$APPDIR/translations" || true

          find "$APPDIR/share/icons/hicolor" -type d -path '*/16x16*' -prune -exec rm -rf {} +
          find "$APPDIR/share/icons/hicolor" -type d -path '*/32x32*' -prune -exec rm -rf {} +
          find "$APPDIR/share/icons/hicolor" -type d -path '*/64x64*' -prune -exec rm -rf {} +
          find "$APPDIR/share/icons/hicolor" -type d -path '*/128x128*' -prune -exec rm -rf {} +
          find "$APPDIR/share/icons/hicolor" -type d -path '*/scalable*' -prune -exec rm -rf {} +

          rm -f "$APPDIR/lib/libsystemd.so."* \
                "$APPDIR/lib/libgcrypt.so."* \
                "$APPDIR/lib/libglib-2.0.so."* \
                "$APPDIR/lib/libbz2.so."* \
                "$APPDIR/lib/liblzma.so."*

          IMAGE_FORMATS="$APPDIR/plugins/imageformats"
          if [ -d "$IMAGE_FORMATS" ]; then
            find "$IMAGE_FORMATS" -type f ! -name 'libqico.so' -delete
          fi

          rm -f "$APPDIR/plugins/tls/libqcertonlybackend.so"
          rm -f "$APPDIR/plugins/xcbglintegrations/libqxcb-egl-integration.so"
          
      - name: Download AppImage runtime with retry
        run: |
          mkdir -p runtime-cache

          for i in 1 2 3; do
            wget -O runtime-cache/runtime-x86_64 \
              https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 \
              && break || sleep 5
          done

      - name: Download appimagetool
        run: |
          wget -O appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Read version from version.txt
        id: get_version
        run: |
          VERSION=$(tr -d '\r\n[:space:]' < version.txt 2>/dev/null || true)
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package cleaned AppDir into AppImage (use appimagetool)
        run: |
          appName="Notesman-x86_64-v${{ steps.get_version.outputs.version }}.AppImage"
          ./appimagetool-x86_64.AppImage --runtime-file runtime-cache/runtime-x86_64 AppDir "${appName}"

      - name: Cleanup tools after packaging
        run: rm -f linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage || true

      - name: Show resulting AppImage
        run: |
          mkdir -p release
          shopt -s nullglob
          appimages=(Notesman*.AppImage)
          if [ ${#appimages[@]} -eq 0 ]; then
            echo "No AppImage found, listing directory:"
            ls -la
            exit 1
          fi
          mv "${appimages[@]}" release/
          
      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: notesman-linux-appimage
          path: release/*.AppImage

      - name: Get existing release body
        id: get_release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_AUTHOR_PAT }}
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'v${{ steps.get_version.outputs.version }}'
              });
              return release.data.body;
            } catch (e) {
              core.setFailed(`Cannot get release: ${e}`);
            }

      - name: Update Linux section in release body
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_AUTHOR_PAT }}
          script: |
            let body = `${{ steps.get_release.outputs.result }}`;
            if (!body) body = "**Notesman v${{ steps.get_version.outputs.version }}**\n\n";

            body = body.replace(/^"+|"+$/g, '');
            
            body = body.replace(/<!-- LINUX_SECTION_START -->[\s\S]*?<!-- LINUX_SECTION_END -->/, `
            <!-- LINUX_SECTION_START -->
            **Linux Build**
            - Linux AppImage included
            <!-- LINUX_SECTION_END -->
            `);

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: 'v${{ steps.get_version.outputs.version }}'
            });

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              body: body
            });

      - name: Upload Linux assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          files: release/*.AppImage
          token: ${{ secrets.RELEASE_AUTHOR_PAT }}
