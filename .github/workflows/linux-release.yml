name: Build & Release (Linux)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-linux
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
  VCPKG_KEEP_ENV_VARS: "CCACHE_DIR;CCACHE_BASEDIR;CCACHE_CONFIGPATH"
  VCPKG_FEATURE_FLAGS: "manifests;compilertracking;binarycaching"
  VCPKG_MAX_CONCURRENCY: 8
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # ---- NEW: Build inside container ----
    container:
      image: mcr.microsoft.com/devcontainers/cpp:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------------------------------------------------
      # NO MORE apt install — container already has tools.
      # ---------------------------------------------------

      - name: Install extra dependencies (only missing ones)
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends \
            jq curl unzip zip ccache patchelf rsync libgl1-mesa-dev \
            libsecret-1-dev libxcb1 libxcb-cursor0 libx11-6 libx11-xcb1 \
            libxext6 libxrender1 libxi6 libxrandr2 libxfixes3 libxkbcommon0 \
            libglu1-mesa libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0

      - name: Setup ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Configure ccache (safe + CI optimized)
        run: |
          mkdir -p "${CCACHE_DIR}"
          printf '%s\n' \
            "max_size = ${CCACHE_MAXSIZE}" \
            "compression = true" \
            "compression_level = 5" \
            "sloppiness = include_file_mtime" \
            "base_dir = ${GITHUB_WORKSPACE}" \
            > "${CCACHE_DIR}/ccache.conf"
          echo "CCACHE_CONFIGPATH=${CCACHE_DIR}/ccache.conf" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> $GITHUB_ENV

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          install-deps: true
          cache: true

      - name: Locate Qt6 installation
        id: find_qt
        run: |
          QT_BIN=$(which qmake-qt6 2>/dev/null || which qmake 2>/dev/null || true)
          if [ -z "$QT_BIN" ]; then
            QT_CMAKE_DIR=$(find $HOME /opt -type d -path "*/Qt*/6*/*/lib/cmake/Qt6" 2>/dev/null | head -n1 || true)
            if [ -z "$QT_CMAKE_DIR" ]; then
              echo "Could not detect Qt installation automatically. Aborting."
              exit 1
            fi
            QT_DIR=$(dirname $(dirname "$QT_CMAKE_DIR"))
          else
            QT_DIR=$(dirname $(dirname "$QT_BIN"))
          fi
          echo "qt_dir=$QT_DIR" >> $GITHUB_OUTPUT
          echo "Qt6_DIR=${QT_DIR}/lib/cmake/Qt6" >> $GITHUB_OUTPUT

      - name: Setup vcpkg (bootstrap)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: 'bd52fac7114fdaa2208de8dd1227212a6683e562'
          vcpkgGitURL: 'https://github.com/microsoft/vcpkg.git'
          runVcpkgInstall: false

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/archives
          key: ${{ runner.os }}-vcpkg-asset-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json') }}
          restore-keys: ${{ runner.os }}-vcpkg-asset-

      - name: Setup vcpkg binary cache path
        run: |
          ABS_ARCHIVES=$(realpath "${VCPKG_ROOT}/archives")
          echo "ABS_ARCHIVES=${ABS_ARCHIVES}" >> $GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;files,${ABS_ARCHIVES},readwrite" >> $GITHUB_ENV

      - name: Prepare vcpkg manifest (remove qtbase)
        run: |
          tmp=$(mktemp)
          jq 'del(.dependencies[] | select(.name == "qtbase"))' vcpkg.json > "$tmp" && mv "$tmp" vcpkg.json

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
            -DQt6_DIR="${{ steps.find_qt.outputs['Qt6_DIR'] }}" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          CC: clang
          CXX: clang++

      - name: Build (parallel)
        run: cmake --build build --parallel

      - name: Prepare AppDir
        run: |
          set -e
          APPDIR=AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib"

          if [ -f ./bin/Notesman ]; then
            cp ./bin/Notesman "$APPDIR/usr/bin/Notesman"
          else
            echo "Built binary not found"
            exit 1
          fi

          cat > "$APPDIR/Notesman.desktop" <<'EOF'
          [Desktop Entry]
          Name=Notesman
          Exec=Notesman
          Icon=notesman
          Type=Application
          Categories=Utility;
          EOF

          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp resources/icons/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/notesman.png"

      - name: Add updater_linux
        run: |
          APPDIR=AppDir
          cp bin/updater_linux "$APPDIR/usr/bin/updater_linux"
          chmod +x "$APPDIR/usr/bin/updater_linux"

      - name: Download linuxdeploy + plugin
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Bundle AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e AppDir/usr/bin/Notesman \
            -d AppDir/Notesman.desktop \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/notesman.png \
            --plugin qt

      - name: Cleanup AppDir
        run: |
          set -e
          APPDIR=AppDir/usr
          rm -rf "$APPDIR/plugins/platforminputcontexts"
          rm -rf "$APPDIR/plugins/platformthemes"
          rm -rf "$APPDIR/share/doc"
          rm -rf "$APPDIR/translations"

      - name: Package AppImage
        run: ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage

      - name: Move AppImage into release/
        run: |
          mkdir -p release
          mv Notesman*.AppImage release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notesman-linux-appimage
          path: release/*.AppImage

      - name: Read version
        id: get_version
        run: |
          VERSION=$(tr -d ' \n\r' < version.txt 2>/dev/null || true)
          [ -z "$VERSION" ] && VERSION="0.0.0"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: "Notesman v${{ steps.get_version.outputs.version }} (Linux AppImage)"
          body: "Automated release."
          files: release/*.AppImage
          token: ${{ secrets.RELEASE_AUTHOR_PAT }}
