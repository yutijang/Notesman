name: Build & Release (Linux)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-linux
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
  VCPKG_MAX_CONCURRENCY: 8
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}  

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install apt packages (build tools)
        run: |
          sudo add-apt-repository -y universe

          sudo apt-get update -y && \
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld cmake ninja-build pkg-config \
            jq curl unzip zip ccache patchelf rsync libgl1-mesa-dev \
            libsecret-1-dev

      - name: Setup ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Configure ccache (safe + CI optimized)
        run: |
          mkdir -p "${CCACHE_DIR}"
          cat > "${CCACHE_DIR}/ccache.conf" <<EOF
          max_size = ${CCACHE_MAXSIZE}
          compression = true
          compression_level = 5
          sloppiness = include_file_mtime
          base_dir = ${GITHUB_WORKSPACE}
          EOF
          echo "CCACHE_CONFIGPATH=${CCACHE_DIR}/ccache.conf" >> $GITHUB_ENV
          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> $GITHUB_ENV

      - name: Setup vcpkg (bootstrap)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: 'bd52fac7114fdaa2208de8dd1227212a6683e562'
          vcpkgGitURL: 'https://github.com/microsoft/vcpkg.git'
          runVcpkgInstall: false

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/archives
          key: ${{ runner.os }}-vcpkg-bin-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json') }}
          restore-keys: ${{ runner.os }}-vcpkg-bin-

      - name: Prepare vcpkg manifest (remove qtbase directly)
        run: |
          if [ ! -f vcpkg.json ]; then
            echo "No vcpkg.json in repo root — aborting"
            exit 1
          fi
          tmp=$(mktemp)
          jq 'del(.dependencies[] | select(.name == "qtbase"))' vcpkg.json > "$tmp" && mv "$tmp" vcpkg.json

      - name: Install Qt6 (from action marketplace) - Shared libs
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          install-deps: true
          cache: true

      - name: Locate Qt6 installation
        id: find_qt
        run: |
          QT_BIN=$(which qmake-qt6 2>/dev/null || which qmake 2>/dev/null || true)
          if [ -z "$QT_BIN" ]; then
            QT_CMAKE_DIR=$(find $HOME /opt -type d -path "*/Qt*/6*/*/lib/cmake/Qt6" 2>/dev/null | head -n1 || true)
            if [ -z "$QT_CMAKE_DIR" ]; then
              echo "Could not detect Qt installation automatically. Aborting."
              exit 1
            fi
            QT_DIR=$(dirname $(dirname "$QT_CMAKE_DIR"))
          else
            QT_DIR=$(dirname $(dirname "$QT_BIN"))
          fi
          echo "qt_bin=$QT_BIN" >> $GITHUB_OUTPUT
          echo "qt_dir=$QT_DIR" >> $GITHUB_OUTPUT
          echo "Qt6_DIR=${QT_DIR}/lib/cmake/Qt6" >> $GITHUB_OUTPUT

      - name: Setup vcpkg binary cache path
        run: |
          ABS_ARCHIVES=$(realpath "${VCPKG_ROOT}/archives")
          echo "ABS_ARCHIVES=${ABS_ARCHIVES}" >> $GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;files,${ABS_ARCHIVES},readwrite" >> $GITHUB_ENV

      - name: Configure CMake (use vcpkg toolchain and Qt6 dir)
        run: |
          echo "Using VCPKG_BINARY_SOURCES=${VCPKG_BINARY_SOURCES}"

          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
            -DQt6_DIR="${{ steps.find_qt.outputs['Qt6_DIR'] }}" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          CC: clang
          CXX: clang++
          
      - name: Build (parallel)
        run: cmake --build build --config ${BUILD_TYPE} --parallel

      - name: Prepare AppDir for linuxdeployqt
        run: |
          set -e
          APPDIR=AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib"
          if [ -f ./bin/Notesman ]; then
            cp ./bin/Notesman "$APPDIR/usr/bin/Notesman"
          elif [ -f build/Notesman ]; then
            cp build/Notesman "$APPDIR/usr/bin/Notesman"
          else
            echo "Built binary not found in ./bin or build/ - adjust paths"
            ls -la ./bin || true
            ls -la build || true
            exit 1
          fi
          cat > "$APPDIR/Notesman.desktop" <<'EOF'
          [Desktop Entry]
          Name=Notesman
          Exec=Notesman
          Icon=notesman
          Type=Application
          Categories=Utility;
          EOF
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -v resources/icons/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/notesman.png" || true

          QTKEYCHAIN_LIB_NAME="libqt6keychain.so.1"
          
          if [ -n "$VCPKG_ROOT" ]; then
              VCPKG_LIB_PATH="$VCPKG_ROOT/installed/x64-linux/lib/$QTKEYCHAIN_LIB_NAME"
              if [ -f "$VCPKG_LIB_PATH" ]; then
                  cp "$VCPKG_LIB_PATH" "$APPDIR/usr/lib/"
                  echo "Copied qtkeychain from vcpkg: $VCPKG_LIB_PATH"
                  exit 0 # Đã tìm thấy và copy, thoát khỏi logic tìm kiếm
              fi
          fi
          
          SYSTEM_LIB_PATHS="/usr/lib/x86_64-linux-gnu /usr/local/lib"
          QTKEYCHAIN_FOUND=false
          
          for dir in $SYSTEM_LIB_PATHS; do
              if [ -f "$dir/$QTKEYCHAIN_LIB_NAME" ]; then
                  cp "$dir/$QTKEYCHAIN_LIB_NAME" "$APPDIR/usr/lib/"
                  echo "Copied qtkeychain from system path: $dir/$QTKEYCHAIN_LIB_NAME"
                  QTKEYCHAIN_FOUND=true
                  break
              fi
          done

          if [ "$QTKEYCHAIN_FOUND" = false ]; then
              echo "::warning title=qtkeychain not found::The required library $QTKEYCHAIN_LIB_NAME was not found in common paths. Final AppImage may fail."
          fi

      - name: Locate qtkeychain built by FetchContent
        run: |
          set -e
          APPDIR=AppDir/usr/lib
          QTKEYCHAIN_NAME="libqt6keychain.so.1"

          SEARCH_PATHS="
            build/_deps/qtkeychain-build
            build/_deps/qtkeychain-build/lib
            build/_deps/qtkeychain-build/src
            build/_deps/qtkeychain-build/*/
          "

          FOUND="false"
          for p in $SEARCH_PATHS; do
            FILE=$(find $p -maxdepth 2 -type f -name "$QTKEYCHAIN_NAME" 2>/dev/null | head -n1 || true)
            if [ -n "$FILE" ]; then
              echo "Found qtkeychain at: $FILE"
              cp "$FILE" "$APPDIR/"
              FOUND="true"
              break
            fi
          done

          if [ "$FOUND" = "false" ]; then
            echo "::warning title=qtkeychain not found in FetchContent build::libqt6keychain.so.1 was not found under _deps."
          fi

      - name: Download linuxdeploy and plugin-qt
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Install Qt runtime dependencies for AppImage
        run: |
          sudo apt-get install -y \
            libxcb1 libxcb-cursor0 libx11-6 libx11-xcb1 libxext6 libxrender1 libxi6 \
            libxrandr2 libxfixes3 libxrender1 libxkbcommon0 libglu1-mesa libfontconfig1 \
            libfreetype6 libdbus-1-3 libglib2.0-0

      - name: Bundle Qt6 app into AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e AppDir/usr/bin/Notesman \
            -d AppDir/Notesman.desktop \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/notesman.png \
            --plugin qt

      - name: Remove unused Qt files from AppDir
        run: |
          set -e
          APPDIR=AppDir/usr
          [ -d "$APPDIR" ] || { echo "AppDir not found"; exit 1; }

          echo "Cleaning unused Qt modules and plugins..."

          rm -rf "$APPDIR/plugins/platforminputcontexts" || true
          rm -rf "$APPDIR/plugins/platformthemes" || true
          rm -rf "$APPDIR/share/doc" || true
          rm -rf "$APPDIR/translations" || true

          find "$APPDIR/share/icons/hicolor" -type d -path '*/16x16*' -prune -exec rm -rf {} +
          find "$APPDIR/share/icons/hicolor" -type d -path '*/32x32*' -prune -exec rm -rf {} +
          find "$APPDIR/share/icons/hicolor" -type d -path '*/64x64*' -prune -exec rm -rf {} +
          find "$APPDIR/share/icons/hicolor" -type d -path '*/128x128*' -prune -exec rm -rf {} +

          rm -f "$APPDIR/lib/libsystemd.so."* \
                "$APPDIR/lib/libgcrypt.so."* \
                "$APPDIR/lib/libglib-2.0.so."* \
                "$APPDIR/lib/libbz2.so."* \
                "$APPDIR/lib/liblzma.so."*

          find "$APPDIR/plugins/imageformats" -type f ! \
                \( -name 'libqico.so' -o -name 'libqjpeg.so' -o -name 'libqsvg.so' -o -name 'libqgif.so' \) \
                -delete

      - name: Package cleaned AppDir into AppImage
        run: ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage

      - name: Cleanup tools after packaging
        run: rm -f linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage || true

      - name: Show resulting AppImage
        run: |
          mkdir -p release
          mv Notesman*.AppImage release/ || true
          if [ -z "$(ls release/*.AppImage 2>/dev/null || true)" ]; then
            echo "No AppImage found in release/, listing directory:"
            ls -la
            exit 1
          fi
          
      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: notesman-linux-appimage
          path: release/*.AppImage

      - name: Extract project version from CMakeLists.txt
        id: get_version
        run: |
          VERSION=$(grep -Po '(?<=VERSION )\d+\.\d+\.\d+' CMakeLists.txt || echo "0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (manual version)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: "Notesman v${{ steps.get_version.outputs.version }} (Linux AppImage)"
          body: "Automated release for Notesman v${{ steps.get_version.outputs.version }}."
          files: release/*.AppImage
          token: ${{ secrets.RELEASE_AUTHOR_PAT }}
